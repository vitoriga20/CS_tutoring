name = "cs-tutoring"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# ---- 敏感密钥：统一用 wrangler pages secret 注入（Pages Functions 不读取 [vars]） ----
#   npx wrangler pages secret put SUPABASE_URL
#   npx wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY
#   -> service_role key 只在函数内使用，绝不暴露给浏览器
#
# ---- 可选环境变量 ----
#   GIGS_CACHE_TTL      gigs 列表边缘缓存秒数，默认 60（写在 .dev.vars / Pages 环境变量）
# ---- 限流 KV（未配置时限流中间件自动降级；生产必须绑定） ----
#   npx wrangler kv namespace create RATE_LIMIT_KV
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_YOUR_KV_ID"
